name: elec_lab
description: ELEC LAB — an offline industrial electric circuit simulator.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  pdf: ^3.11.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/OFL.txt
    - assets/models/manifest.json
    - assets/models/board/
    - assets/models/preview/
    - assets/models/detailed/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
