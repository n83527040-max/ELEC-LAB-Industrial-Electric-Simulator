name: Flutter tests and Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified APK to a GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag (for example v0.1.0)
        required: false
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Android-compatible Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Static analysis
        run: |
          set +e
          flutter analyze > analysis.log 2>&1
          STATUS=$?
          cat analysis.log
          if [ "$STATUS" -ne 0 ]; then
            python3 - analysis.log <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()[-14000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          fi
          exit "$STATUS"

      - name: Unit and widget tests
        run: |
          set +e
          flutter test --coverage > test.log 2>&1
          STATUS=$?
          cat test.log
          if [ "$STATUS" -ne 0 ]; then
            python3 - test.log <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()[-14000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for offset in range(0, len(text), 2400):
              print('::error::' + text[offset:offset + 2400])
          PY
          fi
          exit "$STATUS"

      - name: Build installable Release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          STATUS=$?
          cat build.log
          if [ "$STATUS" -ne 0 ]; then
            python3 - build.log <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()[-14000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for offset in range(0, len(text), 2400):
              print('::error::' + text[offset:offset + 2400])
          PY
          fi
          exit "$STATUS"

      - name: Upload logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elec-lab-ci-logs
          path: |
            analysis.log
            test.log
            build.log
          if-no-files-found: warn

      - name: Verify APK signature and package
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 8
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK and verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elec-lab-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk-sha256.txt
            coverage/lcov.info
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified APK to GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "ELEC LAB $RELEASE_TAG" \
              --notes "Verified Flutter CI build. Debug-signed evaluation APK; see docs/FINAL_REPORT.md for tests, size and limitations."
          fi
          gh release upload "$RELEASE_TAG" \
            "$APK#ELEC-LAB-${RELEASE_TAG#v}-android.apk" \
            apk-sha256.txt \
            --clobber
