name: Flutter tests and Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified APK to a GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag (for example v0.5.0)
        required: false
        default: v0.5.0
        type: string

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Android-compatible Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Audit published APK signing and archive integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/elec-signing-audit
          for TAG in v0.4.0 v0.5.0; do
            mkdir -p "/tmp/elec-signing-audit/$TAG"
            gh release download "$TAG" --pattern app-release.apk --dir "/tmp/elec-signing-audit/$TAG" --clobber
          done
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          for TAG in v0.4.0 v0.5.0; do
            APK="/tmp/elec-signing-audit/$TAG/app-release.apk"
            unzip -tqq "$APK"
            "$ZIPALIGN" -c 4 "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "/tmp/$TAG-signature.log"
            "$AAPT" dump badging "$APK" | head -n 4
            python3 - "$TAG" "/tmp/$TAG-signature.log" <<'PY'
          import sys
          tag, path = sys.argv[1:]
          for line in open(path, encoding='utf-8'):
              line = line.strip()
              if 'Verified using' in line or 'certificate SHA-256 digest' in line:
                  print('::notice::' + tag + ' ' + line)
          PY
          done

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: |
          set +e
          flutter analyze > analysis.log 2>&1
          STATUS=$?
          cat analysis.log
          if [ "$STATUS" -ne 0 ]; then
            python3 - analysis.log <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()[-14000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          fi
          exit "$STATUS"

      - name: Unit and widget tests
        run: |
          set +e
          flutter test --coverage --timeout=45s --concurrency=1 > test.log 2>&1
          STATUS=$?
          cat test.log
          if [ "$STATUS" -eq 0 ]; then
            python3 - test.log <<'PY'
          import pathlib
          import re
          import sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          counts = re.findall(r'(\d+) tests passed', raw)
          if not counts:
              raise SystemExit('Could not determine the verified test count.')
          pathlib.Path('test-count.txt').write_text(counts[-1] + '\n')
          print('::notice::VERIFIED_FLUTTER_TESTS=' + counts[-1])
          PY
          fi
          if [ "$STATUS" -ne 0 ]; then
            python3 - test.log <<'PY'
          import re
          import sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          groups = re.findall(r'::group::❌(.*?)(?=::endgroup::)', raw, re.S)
          for group in groups:
              if len(group) > 12000:
                  group = group[:9000] + '\n... STACK TRUNCATED ...\n' + group[-3000:]
              group = group.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              for offset in range(0, len(group), 2400):
                  print('::error::FAILED TEST: ' + group[offset:offset + 2400])
          if not groups:
              text = raw[-14000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              for offset in range(0, len(text), 2400):
                  print('::error::' + text[offset:offset + 2400])
          PY
          fi
          exit "$STATUS"

      - name: Build installable Release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          STATUS=$?
          cat build.log
          if [ "$STATUS" -ne 0 ]; then
            python3 - build.log <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read()[-14000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for offset in range(0, len(text), 2400):
              print('::error::' + text[offset:offset + 2400])
          PY
          fi
          exit "$STATUS"

      - name: Upload logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elec-lab-ci-logs
          path: |
            analysis.log
            test.log
            build.log
          if-no-files-found: warn

      - name: Verify APK signature and package
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 8
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          export APK_SIZE=$(stat -c '%s' "$APK")
          export APK_SHA=$(cut -d' ' -f1 apk-sha256.txt)
          export TEST_COUNT=$(cat test-count.txt)
          export APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          python3 - <<'PY'
          import json
          import os
          payload = {
              'application': 'ELEC LAB',
              'version': os.environ['APP_VERSION'],
              'package': 'com.eleclab.simulator',
              'commit': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runUrl': (
                  os.environ['GITHUB_SERVER_URL'] + '/' +
                  os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' +
                  os.environ['GITHUB_RUN_ID']
              ),
              'format': 'passed (strict diff check)',
              'flutterAnalyze': 'passed',
              'flutterTests': {
                  'status': 'passed',
                  'count': int(os.environ['TEST_COUNT']),
                  'command': 'flutter test --coverage --timeout=45s --concurrency=1',
              },
              'releaseBuild': 'passed',
              'apkSignature': 'apksigner verify passed; debug evaluation key',
              'packageCheck': 'aapt dump badging passed',
              'apkSizeBytes': int(os.environ['APK_SIZE']),
              'apkSha256': os.environ['APK_SHA'],
              'physicalAndroidDeviceTested': False,
          }
          with open('verification.json', 'w', encoding='utf-8') as output:
              json.dump(payload, output, ensure_ascii=False, indent=2)
              output.write('\n')
          PY

      - name: Upload APK and verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elec-lab-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            apk-sha256.txt
            verification.json
            coverage/lcov.info
          retention-days: 30
          if-no-files-found: error

      - name: Publish verified APK to GitHub Release
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.5.0' }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --title "ELEC LAB $RELEASE_TAG" \
              --notes "Verified Flutter CI build. Debug-signed evaluation APK; see docs/FINAL_REPORT.md for tests, size and limitations."
          fi
          gh release upload "$RELEASE_TAG" \
            "$APK#ELEC-LAB-${RELEASE_TAG#v}-android.apk" \
            apk-sha256.txt \
            verification.json \
            --clobber
